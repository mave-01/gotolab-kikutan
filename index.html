<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼミ英単語テスト</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #e67e22;
            --bg: #f5f6fa;
            --text: #2f3640;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            min-height: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        
        h1, h2 { text-align: center; color: var(--text); }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); }
        .btn-secondary { background-color: #95a5a6; }
        
        .btn-small {
            width: auto;
            padding: 8px 15px;
            margin-bottom: 0;
            font-size: 14px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        input:focus { border-color: var(--primary); outline: none; }

        /* スライダーの見た目調整 */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            margin: 15px 0 25px 0;
        }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #dcdde1;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* 手入力用の数字ボックス */
        .number-input {
            width: 80px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            text-align: right;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            padding: 4px 8px;
            box-sizing: border-box;
        }
        .number-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .card {
            background: var(--bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            transition: background-color 0.2s;
            position: relative;
        }
        
        .word-id-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #dcdde1;
            color: #2f3640;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .hint-jp { font-size: 24px; font-weight: bold; margin-bottom: 10px; margin-top: 10px; }
        .hint-sentence { font-size: 14px; color: #7f8fa6; margin-bottom: 20px; }
        .eng-sentence { font-size: 18px; font-weight: bold; }
        
        .feedback {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .feedback.wrong {
            display: block;
            background-color: #fad390;
            color: var(--danger);
        }
        
        .progress {
            text-align: right;
            font-size: 14px;
            color: #7f8fa6;
            line-height: 1.5;
        }
        
        .timer-display {
            font-size: 16px;
            font-weight: bold;
            color: var(--danger);
            background-color: #fdedec;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;
        }

        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .slider-label {
            font-weight: bold;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. ログイン画面 -->
    <div id="screen-login" class="screen active">
        <h1>ゼミ英単語システム</h1>
        <p style="text-align:center">パスワードを入力してください<br>(※ゼミ共通)</p>
        <input type="password" id="password-input" placeholder="パスワード">
        <button class="btn" onclick="checkPassword()">ログイン</button>
    </div>

    <!-- 2. ローディング画面 -->
    <div id="screen-loading" class="screen">
        <h2>データを読み込み中...</h2>
    </div>

    <!-- 3. 範囲選択画面（大枠 ＆ カスタムスライダー） -->
    <div id="screen-select" class="screen">
        <h2>ゼミの回を選択</h2>
        <div class="session-grid" id="session-buttons">
            <!-- ボタンはJSで生成 -->
        </div>

        <hr style="margin: 30px 0; border: none; border-top: 2px dashed #dcdde1;">
        
        <h2>カスタム範囲を選択</h2>
        <div style="margin-top: 15px;">
            <div class="slider-label">
                <label>開始単語 (No.)</label>
                <!-- スパンから手入力用のinputに変更 -->
                <input type="number" id="custom-start-val" class="number-input" min="1" value="1">
            </div>
            <input type="range" id="custom-start" min="1" max="1120" value="1">
            
            <div class="slider-label">
                <label>終了単語 (No.)</label>
                <!-- スパンから手入力用のinputに変更 -->
                <input type="number" id="custom-end-val" class="number-input" min="1" value="1120">
            </div>
            <input type="range" id="custom-end" min="1" max="1120" value="1120">
            
            <button class="btn btn-success" onclick="startCustomRange()">この範囲で学習する</button>
        </div>
    </div>

    <!-- 3.5. 詳細範囲選択画面 -->
    <div id="screen-sub-select" class="screen">
        <div class="header-bar">
            <button class="btn btn-secondary btn-small" onclick="showScreen('screen-select')">◀ 戻る</button>
        </div>
        <h2 id="sub-select-title">出題範囲を選択</h2>
        <div class="session-grid" id="sub-session-buttons">
            <!-- ボタンはJSで生成 -->
        </div>
    </div>

    <!-- 4. テスト画面 -->
    <div id="screen-test" class="screen">
        <div class="header-bar">
            <button class="btn btn-secondary btn-small" onclick="backToSubSelect()">◀ 中断する</button>
            <div id="timer-display" class="timer-display"></div>
            <div class="progress" id="progress-text"></div>
        </div>
        
        <div class="card" id="test-card">
            <div id="word-id" class="word-id-badge"></div>
            <div class="hint-jp" id="word-jp"></div>
            <div class="hint-sentence" id="sentence-jp"></div>
            <div class="eng-sentence" id="sentence-en"></div>
        </div>
        
        <div id="feedback-area" class="feedback"></div>
        
        <input type="text" id="answer-input" placeholder="英単語を入力" autocomplete="off" autocapitalize="off" spellcheck="false">
        
        <button class="btn btn-secondary" id="idk-btn" onclick="skipQuestion()">わからない</button>
        <button class="btn" id="next-btn" style="display:none;" onclick="nextQuestion()">次へ (Enter)</button>
    </div>

    <!-- 5. 結果画面 -->
    <div id="screen-result" class="screen">
        <h2 id="result-title">結果</h2>
        <p id="result-message" style="text-align:center; font-size: 18px; line-height: 1.6;"></p>
        <button class="btn" id="result-action-btn"></button>
        <button class="btn" style="background-color:#7f8fa6; margin-top:20px;" onclick="showScreen('screen-sub-select')">範囲選択へ戻る</button>
    </div>
</div>

<script>
    let wordData = [];     
    let currentQueue = []; 
    let wrongQueue = [];   
    let currentQuestionIndex = 0;
    let currentWord = null;
    let roundNumber = 1;
    let isWaitingForNext = false; 

    let correctCount = 0;
    let wrongCount = 0;

    // タイマー用変数
    let timerInterval = null;
    let remainingTime = 0;

    const SYSTEM_PASSWORD = "gotolab"; // ←パスワード変更時はここを直してください

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function checkPassword() {
        const pass = document.getElementById('password-input').value;
        if (pass === SYSTEM_PASSWORD) {
            loadData();
        } else {
            alert('パスワードが違います');
        }
    }

    async function loadData() {
        showScreen('screen-loading');
        try {
            const response = await fetch('words.json?' + new Date().getTime());
            if (!response.ok) throw new Error("JSON読み込みエラー");
            wordData = await response.json();
            
            initSliders(); 
            generateSessionButtons();
            showScreen('screen-select');
        } catch (error) {
            alert("データの読み込みに失敗しました。");
            console.error(error);
        }
    }

    // スライダーと手入力の連動処理
    function initSliders() {
        const maxId = Math.max(...wordData.map(w => w.id));
        const startSlider = document.getElementById('custom-start');
        const endSlider = document.getElementById('custom-end');
        const startVal = document.getElementById('custom-start-val');
        const endVal = document.getElementById('custom-end-val');

        // 最大値を設定
        startSlider.max = maxId;
        endSlider.max = maxId;
        endSlider.value = maxId;
        
        startVal.max = maxId;
        endVal.max = maxId;
        endVal.value = maxId;

        // スライダーを動かした時に入力欄を更新
        startSlider.addEventListener('input', () => {
            if (parseInt(startSlider.value) > parseInt(endSlider.value)) {
                endSlider.value = startSlider.value;
                endVal.value = endSlider.value;
            }
            startVal.value = startSlider.value;
        });

        endSlider.addEventListener('input', () => {
            if (parseInt(endSlider.value) < parseInt(startSlider.value)) {
                startSlider.value = endSlider.value;
                startVal.value = startSlider.value;
            }
            endVal.value = endSlider.value;
        });

        // 入力欄に手入力した時にスライダーを更新
        startVal.addEventListener('change', () => {
            let val = parseInt(startVal.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > maxId) val = maxId;
            
            if (val > parseInt(endVal.value)) {
                endVal.value = val;
                endSlider.value = val;
            }
            startVal.value = val;
            startSlider.value = val;
        });

        endVal.addEventListener('change', () => {
            let val = parseInt(endVal.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > maxId) val = maxId;

            if (val < parseInt(startVal.value)) {
                startVal.value = val;
                startSlider.value = val;
            }
            endVal.value = val;
            endSlider.value = val;
        });
    }

    function generateSessionButtons() {
        const container = document.getElementById('session-buttons');
        container.innerHTML = '';
        
        const sessions = [...new Set(wordData.map(w => w.session))].sort((a, b) => a - b);
        
        sessions.forEach(sessionNum => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `第${sessionNum}回`;
            btn.onclick = () => showSubSelect(sessionNum);
            container.appendChild(btn);
        });
    }

    // カスタム範囲のボタンが押されたときの処理（数字入力欄から値を取得）
    function startCustomRange() {
        const startId = parseInt(document.getElementById('custom-start-val').value);
        const endId = parseInt(document.getElementById('custom-end-val').value);
        
        const customWords = wordData.filter(w => w.id >= startId && w.id <= endId);
        
        if(customWords.length === 0) {
            alert("選択された範囲に単語が見つかりません。");
            return;
        }
        showSubSelect(null, customWords, startId, endId);
    }

    // サブメニュー（20単語区切り ＆ 実践テスト）の生成
    function showSubSelect(sessionNum = null, customWords = null, minId = null, maxId = null) {
        const container = document.getElementById('sub-session-buttons');
        container.innerHTML = '';
        
        let targetWords;
        if (customWords) {
            targetWords = customWords;
            document.getElementById('sub-select-title').innerText = `カスタム範囲 (No.${minId}〜${maxId})`;
        } else {
            targetWords = wordData.filter(w => w.session === sessionNum);
            document.getElementById('sub-select-title').innerText = `第${sessionNum}回 - 範囲選択`;
        }

        const chunkSize = 20;
        const numChunks = Math.ceil(targetWords.length / chunkSize);
        
        for (let i = 0; i < numChunks; i++) {
            const chunk = targetWords.slice(i * chunkSize, (i + 1) * chunkSize);
            if (chunk.length === 0) continue;
            
            const chunkMin = chunk[0].id;
            const chunkMax = chunk[chunk.length - 1].id;
            
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${chunkMin}〜${chunkMax} <br><span style="font-size: 13px; font-weight:normal;">(${chunk.length}単語)</span>`;
            btn.onclick = () => startRound(chunk, 1, false);
            container.appendChild(btn);
        }
        
        // 実践テスト（タイマーなし）
        const testBtnNormal = document.createElement('button');
        testBtnNormal.className = 'btn btn-warning';
        testBtnNormal.style.gridColumn = '1 / -1';
        testBtnNormal.style.marginTop = '10px';
        testBtnNormal.innerHTML = `📚 実践テスト <span style="font-size: 14px; font-weight:normal;">(全${targetWords.length}単語 / タイマーなし)</span>`;
        testBtnNormal.onclick = () => startRound(targetWords, 1, false);
        container.appendChild(testBtnNormal);

        // 実践テスト（3分タイマーあり）
        const testBtnTimer = document.createElement('button');
        testBtnTimer.className = 'btn btn-danger';
        testBtnTimer.style.gridColumn = '1 / -1';
        testBtnTimer.innerHTML = `⏱️ 実践テスト <span style="font-size: 14px; font-weight:normal;">(全${targetWords.length}単語 / 3分タイマー)</span>`;
        testBtnTimer.onclick = () => startRound(targetWords, 1, true);
        container.appendChild(testBtnTimer);

        showScreen('screen-sub-select');
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function backToSubSelect() {
        clearInterval(timerInterval);
        showScreen('screen-sub-select');
    }

    function startRound(words, round, useTimer = false) {
        clearInterval(timerInterval); 
        
        currentQueue = shuffleArray([...words]);
        wrongQueue = [];
        currentQuestionIndex = 0;
        roundNumber = round;
        correctCount = 0;
        wrongCount = 0;
        
        const timerDisplay = document.getElementById('timer-display');
        
        if (useTimer) {
            remainingTime = 180; 
            timerDisplay.style.display = 'block';
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                remainingTime--;
                updateTimerUI();
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    handleTimeUp();
                }
            }, 1000);
        } else {
            timerDisplay.style.display = 'none';
        }

        showScreen('screen-test');
        displayQuestion();
    }

    function updateTimerUI() {
        const m = Math.floor(remainingTime / 60).toString().padStart(2, '0');
        const s = (remainingTime % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱ ${m}:${s}`;
    }

    function handleTimeUp() {
        for (let i = currentQuestionIndex; i < currentQueue.length; i++) {
            if (!wrongQueue.includes(currentQueue[i])) {
                wrongQueue.push(currentQueue[i]);
                wrongCount++;
            }
        }
        alert("⏳ タイムアップ！\n残りの問題は不正解として次周に持ち越されます。");
        finishRound();
    }

    function updateProgressUI() {
        const total = currentQueue.length;
        const current = Math.min(currentQuestionIndex + 1, total);
        document.getElementById('progress-text').innerHTML = 
            `周回: ${roundNumber} | 問題: ${current} / ${total}<br>` +
            `<span style="color: var(--success); font-weight: bold;">⭕️ 正解: ${correctCount}</span> | ` +
            `<span style="color: var(--danger); font-weight: bold;">❌ 不正解: ${wrongCount}</span>`;
    }

    function displayQuestion() {
        if (currentQuestionIndex >= currentQueue.length) {
            clearInterval(timerInterval);
            finishRound();
            return;
        }

        currentWord = currentQueue[currentQuestionIndex];
        isWaitingForNext = false;
        
        updateProgressUI();
        
        document.getElementById('word-id').innerText = `No. ${currentWord.id}`;
        document.getElementById('word-jp').innerText = currentWord.meaning;
        document.getElementById('sentence-jp').innerText = currentWord.sentence_jp;
        document.getElementById('sentence-en').innerText = currentWord.sentence;
        
        const input = document.getElementById('answer-input');
        input.value = '';
        input.style.display = 'block';
        input.style.borderColor = '#dcdde1';
        input.focus();
        
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('idk-btn').style.display = 'block'; 
        document.getElementById('next-btn').style.display = 'none'; 
        document.getElementById('test-card').style.backgroundColor = 'var(--bg)';
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            if (isWaitingForNext) {
                nextQuestion();
            } else {
                checkAnswer();
            }
        }
    });

    function checkAnswer() {
        const input = document.getElementById('answer-input');
        const userAnswer = input.value.trim().toLowerCase();
        const correctAnswer = currentWord.word.trim().toLowerCase();
        
        if (userAnswer === correctAnswer) {
            correctCount++;
            updateProgressUI();
            
            const card = document.getElementById('test-card');
            input.style.borderColor = 'var(--success)';
            card.style.backgroundColor = '#e8f8f5'; 
            document.getElementById('idk-btn').style.display = 'none'; 
            
            setTimeout(() => {
                currentQuestionIndex++;
                displayQuestion();
            }, 400); 
        } else {
            handleWrongAnswer(userAnswer);
        }
    }

    function skipQuestion() {
        handleWrongAnswer("(無回答)");
    }

    function handleWrongAnswer(userAnswer) {
        isWaitingForNext = true;
        
        if (!wrongQueue.includes(currentWord)) {
            wrongQueue.push(currentWord);
            wrongCount++;
            updateProgressUI();
        }

        const input = document.getElementById('answer-input');
        const card = document.getElementById('test-card');
        const feedbackArea = document.getElementById('feedback-area');

        input.style.borderColor = 'var(--danger)';
        card.style.backgroundColor = '#fdedec'; 
        
        feedbackArea.className = 'feedback wrong';
        feedbackArea.innerHTML = `正解: <span style="font-size:24px;">${currentWord.word}</span><br><span style="font-size:14px; color:#7f8fa6;">あなたの入力: ${userAnswer}</span>`;
        feedbackArea.style.display = 'block';
        
        input.style.display = 'none';
        document.getElementById('idk-btn').style.display = 'none'; 
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
        nextBtn.className = 'btn btn-danger';
        nextBtn.focus();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        displayQuestion();
    }

    function finishRound() {
        showScreen('screen-result');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const actionBtn = document.getElementById('result-action-btn');

        if (wrongQueue.length === 0) {
            title.innerText = "🎉 全問正解クリア！";
            title.style.color = "var(--success)";
            message.innerHTML = `素晴らしい！<br>この範囲を完璧にマスターしました。`;
            actionBtn.style.display = 'none';
        } else {
            title.innerText = "まだまだ！";
            title.style.color = "var(--danger)";
            message.innerHTML = `間違えた単語が <strong>${wrongQueue.length} 問</strong> あります。<br>間違えた単語だけで ${roundNumber + 1} 周目を開始します。`;
            actionBtn.style.display = 'block';
            actionBtn.className = 'btn btn-danger';
            actionBtn.innerText = `${roundNumber + 1}周目を開始する`;
            actionBtn.onclick = () => startRound(wrongQueue, roundNumber + 1, false);
        }
    }

    document.getElementById('password-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkPassword();
    });
</script>

</body>
</html>
